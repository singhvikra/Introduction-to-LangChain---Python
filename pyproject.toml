[project]
name = "intro-to-langchain"
version = "0.1.0"
description = "Coursework for LangChain Academy: Introduction to LangChain (Python)"
readme = "README.md"
authors = [
    { name = "Vikram Singh", email = "singhvikra@microsoft.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.9",
    "langchain>=1.3.10",
    "langchain-anthropic>=1.5.1",
    "langchain-community>=0.4.1",
    "langchain-core>=1.3.3",
    "langchain-google-genai>=4.3.2",
    "langchain-google-vertexai>=3.0.3",
    "langchain-mcp-adapters>=0.1.13",
    "langchain-model-profiles>=0.0.4",
    "langchain-openai>=1.7.3",
    "langchain-tavily>=0.2.13",
    "langchain-text-splitters>=1.0.0",
    "langgraph>=1.0.3",
    "langgraph-api>=0.5.37",
    "langgraph-cli>=0.4.9",
    "langsmith>=0.14.14",
    "mcp>=1.21.1",
    "pypdf>=6.13.3",
    "python-dotenv>=1.2.0",
    "scipy>=1.16.3",
    "sounddevice>=0.5.3",
    "tavily>=1.1.0",
    "tavily-python>=0.7.13",
]

[project.scripts]
intro-to-langchain = "intro_to_langchain:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
